# docker-compose（本地/小规格形态）
#
# 快速开始：
#   cp .env.example .env
#   docker compose up --build
#
# 说明：
# - 本地以单 MySQL 模拟「与 new-api 共享实例」；tasks 表由 new-api AutoMigrate
#   初始化。**零自有表**：网关不建任何表，自有状态全部在 Redis（AOF everysec）
#   与环境变量。
# - **零路由文件**：上游配置唯一事实源是 keypool 渠道元数据（group=biz 同名
#   约定 + 渠道 setting.gateway 提取配置块），随租约实时下发。
# - 两个外部微服务（keypool/newapi-billing）地址在 .env 配置。

services:
  gateway:
    build: .
    command: gunicorn -c gunicorn.conf.py app.main:app
    env_file: .env
    environment: &gwenv
      GW_DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-gw}:${MYSQL_PASSWORD:-devonly}@mysql:3306/new_api?charset=utf8mb4
      GW_REDIS_URL: redis://redis:6379/0
      GUNICORN_WORKERS: "3"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim 无 curl，用标准库 urllib 探活
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 60s
    restart: unless-stopped

  worker:   # 探测/结算/通知执行器 + 内嵌 scheduler（延迟派发 + 每分钟 sweep）
    build: .
    # scheduler 合并进 worker 进程（小规格形态）；**scheduler 必须单副本**——
    # worker 扩 replicas 时把 scheduler 拆回独立服务（command: taskiq scheduler app.queue:scheduler）
    command: sh -c "taskiq scheduler app.queue:scheduler & exec taskiq worker app.queue:broker --max-async-tasks 100"
    env_file: .env
    environment: *gwenv
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    restart: unless-stopped

  taskiq-admin:  # 队列看板（任务执行层观测；业务语义层走 logfire）：只绑回环
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    environment:
      TASKIQ_ADMIN_API_TOKEN: ${GW_TASKIQ_ADMIN_API_TOKEN:-}
    volumes:
      - taskiq-admin-data:/usr/database/
    ports:
      - "127.0.0.1:3000:3000"     # 只绑 127.0.0.1；对外暴露请走反代 + basic auth
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    # 本地开发默认口令 devonly（仅本地，勿用于生产）；生产在 .env 覆盖
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devonly}
      MYSQL_DATABASE: new_api
      MYSQL_USER: ${MYSQL_USER:-gw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devonly}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devonly}"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  redis:
    image: redis:7
    # Redis 承接自有状态（taskiq 队列/延迟任务、幂等键、令牌会话、熔断计数、
    # 路由热覆盖）：必须 AOF everysec（丢失窗口 ≤1s，残差由 sweep 巡检收敛）
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  redis-data:
  taskiq-admin-data:
