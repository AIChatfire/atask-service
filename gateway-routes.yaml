# 动态路由兜底配置（配置中心不可达时接管；主源是配置中心微服务）
# 热覆盖：HSET gw:routes:override <biz> '<json>'，并 INCR gw:config_ver 秒级生效
#
# 状态映射说明：status_map 为【可选覆盖】。未配置时由 statusmap 自动映射：
#   内置字典全枚举（success/succeeded/completed/failed/expired/canceled/queued/processing/...）
#   → 前缀归一猜测（兼容 TASK_STATUS_SUCCEED / task.succeeded 等风格）
#   目标枚举兼容 NewAPI tasks：SUBMITTED/QUEUED/IN_PROGRESS/SUCCESS/FAILURE/CANCELED
#   未识别的状态会打 warning 日志 —— 先在 status_map 里应急，稳定后回流内置字典。
kling:
  upstream_base_url: https://api.klingai.com
  auth_type: bearer                 # bearer | x-api-key | none
  submit_path: /v1/videos/text2video   # 任务提交端点（按实际上游修改）
  probe_path: /v1/videos/text2video/{upstream_task_id}
  task_id_path: data.task_id        # 提交响应中上游任务ID的 JSON 路径（点分）
  status_path: data.task_status     # 探测/回调报文中状态字段的 JSON 路径
  result_path: data.task_result     # 终态响应中结果字段的 JSON 路径
  # status_map:                   # 可选：显式覆盖自动映射
  #   succeed: SUCCESS
  #   failed: FAILURE
  timeout_sec: 600
  supports_callback: true
  callback_secret: ""               # 入站回调 HMAC-SHA256 密钥（上游侧配置）
  callback_sig_header: X-Signature
  pricing_biz_type: kling
  key_group: default                # keypool 分组
  default_model: kling-v2-6         # 请求体未带 model 时的计费兜底模型

seedance:
  upstream_base_url: https://visual.volcengineapi.com
  auth_type: bearer
  submit_path: /v1/contents/generations/tasks
  probe_path: /v1/contents/generations/tasks/{upstream_task_id}
  task_id_path: id
  status_path: status
  result_path: content
  timeout_sec: 900
  supports_callback: false          # 不支持回调的上游，走 Poller 轮询
  pricing_biz_type: seedance
