# docker-compose（本地/小规格形态）
#
# 快速开始：
#   cp .env.example .env          # TASKIQ_ADMIN_API_TOKEN 现在是必填，别漏
#   docker compose up --build
#
# 说明：
# - 本地以单 MySQL 模拟「与 new-api 共享实例」；tasks 表由 new-api AutoMigrate
#   初始化。**零自有表**：网关不建任何表，自有状态全部在 Redis（AOF everysec）
#   与环境变量。
# - **零路由文件**：上游配置唯一事实源是 keypool 渠道元数据（group=biz 同名
#   约定 + 渠道 setting.gateway 提取配置块），随租约实时下发。
# - 两个外部微服务（keypool/newapi-billing）地址在 .env 配置。

# 两个应用服务（gateway/worker）共用同一镜像与运行基线，anchor 复用防漂移
x-app-base: &app-base
  # 镜像策略：image + build + pull_policy: build 三者同时写。
  # 坑（本项目踩过）：ghcr.io 的私有镜像未先 `docker login` 时，`docker compose pull`
  # 会**静默失败**，`up -d` 于是沿用上一次的旧镜像——表现是「重建了容器但新代码没进去」，
  # 排查半天才发现跑的还是旧镜像。pull_policy: build 强制每次从源码构建，根除这个坑。
  # 要吃远端镜像请换成明确的版本 tag（不要用 latest），并确保已 login。
  image: ghcr.io/aichatfire/atask-service:latest
  build: .
  pull_policy: build
  env_file: .env
  restart: unless-stopped
  # 日志限额：json-file 默认无限增长，几个 GB 后打爆磁盘拖垮宿主机
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  gateway:
    <<: *app-base
    command: gunicorn -c gunicorn.conf.py app.main:app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim 无 curl，用标准库 urllib 探活
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    # 必须 > gunicorn 的 graceful_timeout（默认 75s），否则 Docker 先 SIGKILL，
    # 在飞的请求被硬截断。改 gunicorn.conf.py 的 timeout/graceful 推导时这里同步加大。
    stop_grace_period: 90s

  worker:   # 探测/结算/通知执行器 + 内嵌 scheduler（延迟派发 + 每分钟 sweep）
    <<: *app-base
    # scheduler 合并进同一容器（小规格形态）；**scheduler 必须单副本**——
    # worker 扩 replicas 时把 scheduler 拆回独立服务（command: taskiq scheduler
    # app.queue:scheduler），否则多份 scheduler 会重复触发 cron。
    #
    # 用 bash 包一层是为了**信号转发与故障可见性**（原来的
    # `sh -c "... scheduler & exec worker"` 让 scheduler 成了孤儿：停机拿不到
    # SIGTERM，它自己崩了容器也不退出，只能靠猜）。这里：
    #   - set -e：脚本自身出错即失败退出；
    #   - trap：把 SIGTERM/SIGINT 转发给 scheduler 与 worker 两个子进程；
    #   - wait -n：任一子进程退出即整体退出，交给 restart: unless-stopped 拉起。
    #
    # 【转义纪律】compose 对**整份文件**做变量插值，`$name` 与 `${name}` 都吃。
    # 脚本里的 shell 变量必须写成 `$$name`（compose 把 `$$` 还原成 `$`）；
    # 只有 `${QUEUE_MAX_ASYNC_TASKS:-10240}` 这种是真要交给 compose 求值的。
    command:
      - bash
      - -c
      - |
        set -e
        term() { kill -TERM "$$sched" "$$wk" 2>/dev/null || true; }
        trap term TERM INT
        taskiq scheduler app.queue:scheduler &
        sched=$$!
        taskiq worker app.queue:broker --max-async-tasks "${QUEUE_MAX_ASYNC_TASKS:-10240}" &
        wk=$$!
        rc=0
        # 任一子进程退出即跳出等待（|| rc=$? 保证 set -e 下仍能拿到退出码）
        wait -n "$$sched" "$$wk" || rc=$$?
        term
        wait "$$sched" "$$wk" 2>/dev/null || true
        exit "$$rc"
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      # worker 无 HTTP 端口，探 Redis 连通性代替（进程死了容器会退出并由 restart 拉起）
      test: ["CMD", "python", "-c", "import os,socket;u=os.environ.get('REDIS_URL','redis://redis:6379/0');h=u.split('//',1)[1].split('/')[0];host,_,port=h.partition(':');socket.create_connection((host,int(port or 6379)),timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # worker 在飞任务需要时间收尾（探测/结算写库），给足优雅退出窗口
    stop_grace_period: 60s

  taskiq-admin:  # 队列看板（任务执行层观测；业务语义层走 logfire）：只绑回环
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    environment:
      # 必填：空 token 等于把看板对同网络（乃至反代后的公网）完全开放。
      # `:?` 让 .env 缺失该值时 compose 直接报错（附原因），而不是默默用空口令。
      TASKIQ_ADMIN_API_TOKEN: ${TASKIQ_ADMIN_API_TOKEN:?请在 .env 里配置 TASKIQ_ADMIN_API_TOKEN（openssl rand -hex 16）}
    volumes:
      - taskiq-admin-data:/usr/database/
    ports:
      - "127.0.0.1:3003:3000"     # 只绑 127.0.0.1；对外暴露请走反代 + basic auth
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: redis:latest
    # Redis 承接自有状态（taskiq 队列/延迟任务、幂等键、令牌会话、熔断计数、
    # 路由热覆盖）：必须 AOF everysec（丢失窗口 <=1s，残差由 sweep 巡检收敛）
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      # named volume：数据要跨容器重建持久化（AOF 文件在 /data，丢了等于丢全部在途状态）
      - redis-data:/data
    ports:
      # 只绑回环：Redis 无密码，绑 0.0.0.0 等于把它暴露到局域网；compose 内服务
      # 走 redis:6379，宿主端口仅供本机调试
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

# named volumes：由 compose 管理生命周期，避免宿主绝对路径（/www/docker/...）
# 在别的机器上不存在或权限不对导致起不来
volumes:
  redis-data:
  taskiq-admin-data:
